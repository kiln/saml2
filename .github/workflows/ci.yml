name: CI
on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@main
    - name: use node 24
      uses: actions/setup-node@v2
      with:
        node-version: 24.x
    - run: npm i
    - run: npm test
